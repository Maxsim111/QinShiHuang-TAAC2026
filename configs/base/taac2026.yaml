task: taac2026

paths:
  raw_data: local_workspace/datasets/TAAC2026/data_sample_1000/raw/sample_data.parquet
  feature_dir: local_workspace/outputs/taac2026/deepfm/features
  log_dir: local_workspace/logs/taac2026/deepfm
  checkpoint_dir: local_workspace/checkpoints/taac2026/deepfm

device:
  cuda_visible_devices: "0"
  required_device_keyword: "5090"

data:
  target_action_type: 1
  train_ratio: 0.7
  valid_ratio: 0.3

training:
  seed: 2026
  batch_size: 64
  epochs: 200
  learning_rate: 0.0003
  weight_decay: 0.0005
  embed_dim: 16
  hidden_units: [256, 128, 64]
  dropout: 0.25
  early_stopping_patience: 30
  lr_decay_factor: 0.5
  lr_decay_patience: 10
  num_workers: 2
  use_pos_weight: true
  max_grad_norm: 5.0
